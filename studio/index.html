<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Grok Bot Skin Studio</title>
    <link rel="stylesheet" href="/studio.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <strong id="brand-title">Grok Bot Skin Studio</strong>
        <span>Skin Kit</span>
      </div>
      <div class="top-meta">
        <div id="lang" class="lang" role="group" aria-label="Language">
          <button type="button" data-locale="en">English</button>
          <button type="button" data-locale="zh">中文</button>
        </div>
        <div id="status" class="status">Checking Grok Bot…</div>
      </div>
    </header>

    <main class="layout">
      <aside class="rail" id="rail" aria-label="Skin packs"></aside>
      <section class="stage">
        <div class="device" id="device">
          <div class="titlebar">
            <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
            <span id="device-title">Grok Bot</span>
          </div>
          <div class="workspace">
            <div class="sidebar" id="sidebar"></div>
            <div class="chat">
              <div class="transcript" id="transcript"></div>
              <div class="composer" id="composer">Message this bot…</div>
            </div>
          </div>
        </div>
        <section class="detail" id="detail"></section>
      </section>
    </main>

    <p class="footnote" id="footnote">
      Chrome skins overlay CSS tokens. They do not modify Grok Bot.app.
    </p>
    <script type="module" src="/studio.js"></script>
  </body>
</html>
